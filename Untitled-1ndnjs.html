<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Anime Universe</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, sans-serif;
      background: linear-gradient(135deg, #0d0d0d 0%, #1a1a1a 100%);
      color: #fff;
      line-height: 1.6;
    }

    header {
      background: #1a1a1a;
      padding: 20px;
      text-align: center;
      border-bottom: 3px solid #ff4081;
      box-shadow: 0 4px 10px rgba(255, 64, 129, 0.3);
    }

    header h1 {
      font-size: 2.5em;
      margin-bottom: 20px;
      color: #ff4081;
      text-shadow: 0 0 10px rgba(255, 64, 129, 0.5);
    }

    nav {
      display: flex;
      justify-content: center;
      gap: 20px;
      flex-wrap: wrap;
    }

    nav a {
      color: #ff4081;
      text-decoration: none;
      font-weight: bold;
      padding: 8px 15px;
      border-radius: 5px;
      transition: all 0.3s ease;
    }

    nav a:hover {
      background: #ff4081;
      color: #000;
      transform: scale(1.1);
    }

    .search-container {
      margin-top: 15px;
    }

    .search-container input {
      padding: 10px 15px;
      border: 2px solid #ff4081;
      border-radius: 5px;
      background: #0d0d0d;
      color: #fff;
      font-size: 14px;
      width: 100%;
      max-width: 300px;
      transition: all 0.3s ease;
    }

    .search-container input:focus {
      outline: none;
      box-shadow: 0 0 15px #ff4081;
      border-color: #00e5ff;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 20px;
      padding: 30px 20px;
      max-width: 1400px;
      margin: 0 auto;
    }

    .card {
      background: #1f1f1f;
      border-radius: 10px;
      overflow: hidden;
      text-align: center;
      transition: all 0.3s ease;
      border: 2px solid transparent;
      box-shadow: 0 5px 15px rgba(0, 0, 0, 0.3);
    }

    .card:hover {
      transform: scale(1.05);
      border-color: #ff4081;
      box-shadow: 0 0 20px rgba(255, 64, 129, 0.6);
    }

    .card img {
      width: 100%;
      height: 300px;
      object-fit: cover;
      border-radius: 0;
    }

    .card-content {
      padding: 15px;
    }

    .card h3 {
      margin: 10px 0;
      color: #ff4081;
      font-size: 1.3em;
    }

    .card p {
      font-size: 14px;
      color: #cccccc;
      margin: 10px 0;
      min-height: 40px;
    }

    iframe {
      width: 100%;
      height: 180px;
      margin: 10px 0;
      border-radius: 8px;
      border: none;
      box-shadow: 0 0 10px rgba(255, 64, 129, 0.3);
    }

    .card a {
      display: inline-block;
      margin-top: 10px;
      padding: 10px 20px;
      color: #00e5ff;
      text-decoration: none;
      background: rgba(0, 229, 255, 0.1);
      border: 2px solid #00e5ff;
      border-radius: 5px;
      transition: all 0.3s ease;
      font-weight: bold;
    }

    .card a:hover {
      background: #00e5ff;
      color: #000;
      transform: translateY(-2px);
    }

    footer {
      background: #1a1a1a;
      text-align: center;
      padding: 20px;
      margin-top: 40px;
      border-top: 3px solid #ff4081;
      color: #cccccc;
    }

    footer p {
      margin: 0;
    }

    .loading {
      text-align: center;
      padding: 40px;
      font-size: 18px;
      color: #ff4081;
      grid-column: 1 / -1;
    }

    @media (max-width: 768px) {
      header h1 {
        font-size: 1.8em;
      }

      nav {
        flex-direction: column;
        gap: 10px;
      }

      .grid {
        grid-template-columns: 1fr;
        padding: 15px;
      }

      .search-container input {
        width: 100%;
      }
    }
  </style>
</head>
<body>
  <header>
    <h1>🎌 Anime Universe</h1>
    <nav>
      <a href="#home">Home</a>
      <a href="#library">Library</a>
      <a href="#news">News</a>
      <a href="#contact">Contact</a>
    </nav>
    <div class="search-container">
      <input type="text" id="searchInput" placeholder="Search anime...">
    </div>
  </header>

  <section class="grid" id="animeGrid">
    <div class="loading">Loading anime data...</div>
  </section>

  <footer>
    <p>&copy; 2026 Anime Universe | Built for fans, linking to official sources</p>
  </footer>

  <script>
    // YouTube API Configuration
    const YT_API_KEY = "AIzaSyDRNsu2-pJuAPdvTz1sh65Em8X0EOLdL3I";
    const YOUTUBE_API = "https://www.googleapis.com/youtube/v3/search";

    // AniList API Configuration
    const ANILIST_API = "https://graphql.anilist.co";

    // GraphQL Query for popular anime
    const ANIME_QUERY = `
      query {
        Page(page: 1, perPage: 12) {
          media(type: ANIME, sort: POPULARITY_DESC) {
            id
            title { romaji english }
            description(asHtml: false)
            coverImage { large }
            siteUrl
            startDate { year }
            status
            episodes
            genres
          }
        }
      }
    `;

    // Function to fetch YouTube trailer
    async function getTrailer(title) {
      try {
        const response = await fetch(
          `${YOUTUBE_API}?part=snippet&type=video&q=${encodeURIComponent(title + " official trailer")}&key=${YT_API_KEY}&maxResults=1`
        );
        const data = await response.json();
        if (data.items && data.items.length > 0) {
          return `https://www.youtube.com/embed/${data.items[0].id.videoId}`;
        }
      } catch (error) {
        console.warn(`Could not fetch trailer for ${title}:`, error);
      }
      return null;
    }

    // Fetch and display anime
    async function loadAnime() {
      try {
        const container = document.getElementById("animeGrid");

        const response = await fetch(ANILIST_API, {
          method: "POST",
          headers: {
            "Content-Type": "application/json",
            "Accept": "application/json"
          },
          body: JSON.stringify({ query: ANIME_QUERY })
        });

        if (!response.ok) {
          throw new Error(`API Error: ${response.statusText}`);
        }

        const data = await response.json();

        if (data.errors) {
          container.innerHTML = `<div class="loading">Error loading anime. Please try again later.</div>`;
          console.error("API Error:", data.errors);
          return;
        }

        const animeList = data.data.Page.media;
        container.innerHTML = "";

        for (const anime of animeList) {
          const card = document.createElement("div");
          card.className = "card";

          const genres = anime.genres ? anime.genres.join(", ") : "N/A";
          const episodes = anime.episodes || "?";
          const description = anime.description 
            ? anime.description.replace(/<[^>]*>/g, "").slice(0, 120) + "..."
            : "No description available";

          // Fetch trailer
          const trailerUrl = await getTrailer(anime.title.romaji || anime.title.english);

          card.innerHTML = `
            <img src="${anime.coverImage.large}" alt="${anime.title.romaji}">
            <div class="card-content">
              <h3>${anime.title.romaji || anime.title.english}</h3>
              <p><strong>Year:</strong> ${anime.startDate.year || "N/A"}</p>
              <p><strong>Episodes:</strong> ${episodes}</p>
              <p><strong>Genres:</strong> ${genres}</p>
              <p>${description}</p>
              <p><strong>Status:</strong> ${anime.status || "Unknown"}</p>
              ${trailerUrl ? `<iframe src="${trailerUrl}" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen></iframe>` : ''}
              <a href="${anime.siteUrl}" target="_blank" rel="noopener noreferrer">View on AniList ↗</a>
            </div>
          `;

          container.appendChild(card);
        }

      } catch (error) {
        console.error("Error loading anime:", error);
        const container = document.getElementById("animeGrid");
        container.innerHTML = `<div class="loading">⚠️ Error loading anime data. Please check your connection.</div>`;
      }
    }

    // Search functionality
    document.getElementById("searchInput").addEventListener("input", function(e) {
      const searchTerm = e.target.value.toLowerCase();
      const cards = document.querySelectorAll(".card");

      cards.forEach(card => {
        const title = card.querySelector("h3").textContent.toLowerCase();
        const genres = card.textContent.toLowerCase();

        if (title.includes(searchTerm) || genres.includes(searchTerm)) {
          card.style.display = "block";
        } else {
          card.style.display = "none";
        }
      });
    });

    // Load anime on page load
    window.addEventListener("load", loadAnime);
  </script>
</body>
</html>
